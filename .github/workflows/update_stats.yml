name: Generate Profile Stats SVG
on:
  schedule:
    - cron: "0 0 * * *" # Har raat 12 baje automatically chalega
  workflow_dispatch:     # Aap manually bhi run kar sakti hain

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate stats card
        uses: soulteary/github-readme-stats-action@v1.0.0
        with:
          card: stats
          options: username=Tuba-05&show_icons=true&theme=tokyonight&hide_border=true
          path: stats.svg
          token: ${{ secrets.PAT_TOKEN }} # Yahan PAT_TOKEN kar diya hai

      - name: Generate top languages card
        uses: soulteary/github-readme-stats-action@v1.0.0
        with:
          card: top-langs
          options: username=Tuba-05&layout=compact&theme=tokyonight&hide_border=true
          path: top-langs.svg
          token: ${{ secrets.PAT_TOKEN }} # Yahan bhi PAT_TOKEN kar diya hai

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add stats.svg top-langs.svg
          git commit -m "chore: update profile stats cards" || echo "No changes to commit"
          git push
